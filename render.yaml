services:
  - type: web
    name: clipforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  - type: web
    name: clipforge-frontend
    runtime: static
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/video-clipper build
    staticPublishPath: ./artifacts/video-clipper/dist/public
    envVars:
      - key: PORT
        value: "10000"
      - key: BASE_PATH
        value: /
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: clipforge-api
          property: host
