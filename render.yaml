services:
  - type: web
    name: clipforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  - type: web
    name: clipforge-frontend
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/video-clipper build
    startCommand: pnpm --filter @workspace/video-clipper serve
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
